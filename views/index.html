<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
    <title>Exercise Tracker</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div class="container">
      <h1>Exercise Tracker</h1>
      <form id="create-user-form" action="/api/users" method="post">
        <h2>Create a New User</h2>
        <p class="code"><code>POST /api/users</code></p>
        <label for="uname">Username</label>
        <input id="uname" type="text" name="username" placeholder="username" required/>
        <input type="submit" value="Submit" />
      </form>
      <form id="exercise-form">
        <h2>Add exercise</h2>
        <p class="code"><code>POST /api/users/:_id/exercises</code></p>
        <label for="exercise-user-select">User</label>
        <select id="exercise-user-select" class="user-dropdown">
          <option value="">Select a user...</option>
        </select>
        <label for="desc">Description</label>
        <input id="desc" type="text" name="description" placeholder="description*" required/>
        <label for="dur">Duration</label>
        <input id="dur" type="number" name="duration" min="1" step="1" placeholder="duration* (mins.)" />
        <label for="date">Date (optional)</label>
        <input id="date" type="date" name="date" />
        <input type="submit" value="Submit" />
      </form>
      <form id="log-form">
        <h2>View Exercise Log</h2>
        <p class="code"><code>GET /api/users/:_id/logs?[from][&amp;to][&amp;limit]</code></p>
        <p class="optional-get-queries code"><strong>[ ]</strong> = optional</p>
        <p class="optional-get-queries code"><strong>from, to</strong> = dates (yyyy-mm-dd); <strong>limit</strong> = number</p>
        <label for="log-user-select">User</label>
        <select id="log-user-select" class="user-dropdown">
          <option value="">Select a user...</option>
        </select>
        <label for="log-from">From (optional)</label>
        <input id="log-from" type="date"/>
        <label for="log-to">To (optional)</label>
        <input id="log-to" type="date"/>
        <label for="log-limit">Limit of how many to list (optional)</label>
        <input id="log-limit" type="number" min="1" step="1" placeholder="Limit"/>
        <input type="submit" value="View Log" />
      </form>
    </div>
    <dialog id="response-modal">
      <h2 id="modal-title"></h2>
      <div id="modal-content"></div>
      <details>
        <summary>JSON Response</summary>
        <pre id="modal-json"></pre>
      </details>
      <div id="modal-buttons" class="modal-buttons">
      </div>
    </dialog>
    
    <script src="/app.js"></script>
  </body>
</html>
